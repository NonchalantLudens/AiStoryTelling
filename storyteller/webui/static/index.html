<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storyteller · 讲故事视频工作台</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1e2230; --border: #2a2f3f;
    --text: #e6e8ef; --dim: #8a90a3; --accent: #6c8cff; --accent2: #8b6cff;
    --ok: #4fc380; --err: #ff6c6c; --warn: #ffc86c; --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
  }
  header {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center;
    gap: 16px; padding: 12px 24px; background: rgba(15,17,23,.92);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; color: var(--accent); flex: 1; }
  header .status { color: var(--dim); font-size: 12px; }
  .btn {
    border: none; border-radius: 9px; padding: 9px 18px; font-size: 14px;
    font-weight: 600; cursor: pointer; background: var(--panel2); color: var(--text);
  }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .btn.small { padding: 5px 12px; font-size: 12px; font-weight: 500; }
  .btn:hover { filter: brightness(1.12); }
  .btn:disabled { opacity: .5; cursor: default; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 24px 80px; }
  .step {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px;
  }
  .step h2 {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; margin: 0 0 12px;
  }
  .step h2 .no {
    width: 24px; height: 24px; border-radius: 50%; background: var(--panel2);
    color: var(--accent); display: inline-flex; align-items: center;
    justify-content: center; font-size: 13px; flex: none;
  }
  .step h2 .hint { color: var(--dim); font-size: 12px; font-weight: 400; margin-left: auto; }
  label.f { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  textarea {
    width: 100%; min-height: 170px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 9px; padding: 12px;
    font-size: 14px; line-height: 1.7; resize: vertical;
  }
  input[type=text], select {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px;
  }
  input[type=text] { width: 100%; }
  textarea.drag { border-color: var(--accent); }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  details.segbox { margin-top: 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--panel2); }
  details.segbox summary {
    cursor: pointer; padding: 10px 14px; font-size: 13px; color: var(--text);
    user-select: none; display: flex; align-items: center; gap: 8px;
  }
  details.segbox summary .cnt { color: var(--accent); font-weight: 700; }
  details.segbox .inner { padding: 4px 14px 14px; }
  .seg {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 9px; margin-top: 8px;
  }
  .seg .idx { color: var(--accent); font-weight: 700; font-size: 12px; flex: none; }
  .seg .txt { flex: 1; line-height: 1.5; }
  .seg .dur { color: var(--dim); font-size: 12px; flex: none; }
  audio { height: 32px; flex: none; }
  .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .theme {
    border: 2px solid var(--border); border-radius: 10px; overflow: hidden;
    cursor: pointer; background: var(--panel2); position: relative;
  }
  .theme.sel { border-color: var(--accent); }
  .theme video { width: 100%; height: 110px; object-fit: cover; display: block; filter: brightness(.85); }
  .theme .name { padding: 7px 10px; font-size: 13px; display: flex; justify-content: space-between; }
  .theme .name small { color: var(--dim); }
  .upload { margin-top: 12px; display: flex; gap: 10px; align-items: center; color: var(--dim); font-size: 12px; flex-wrap: wrap; }
  .checkbox { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim); }
  .dropzone {
    border: 2px dashed var(--border); border-radius: 10px; padding: 18px;
    text-align: center; color: var(--dim); font-size: 13px;
    display: flex; gap: 8px; align-items: center; justify-content: center;
    transition: border-color .2s;
  }
  .dropzone.drag { border-color: var(--accent); color: var(--accent); }
  .sttjob {
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; font-size: 13px;
  }
  .sttjob .txt {
    margin-top: 6px; color: var(--dim); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .sttjob .txt.open { display: block; }
  .jobs { margin-top: 8px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab {
    background: var(--panel2); color: var(--dim); border: 1px solid var(--border);
    border-radius: 99px; padding: 6px 16px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .tab.sel { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab span { opacity: .8; }
  .del { color: var(--dim); cursor: pointer; margin-left: 8px; font-size: 12px; }
  .del:hover { color: var(--err); }
  .chips { padding: 0 10px 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--border); border-radius: 99px; padding: 2px 8px; font-size: 11px;
    display: inline-flex; align-items: center; gap: 4px; color: var(--text);
  }
  .chip .del { margin-left: 0; }
  .job {
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
  }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; margin-left: 8px; }
  .badge.done { background: var(--ok); color: #08130c; }
  .badge.failed, .badge.cancelled, .badge.interrupted { background: var(--err); color: #fff; }
  .badge.running { background: var(--warn); color: #241a00; }
  .badge.queued { background: var(--border); color: var(--dim); }
  .bar { height: 5px; background: var(--border); border-radius: 4px; margin: 8px 0 6px; overflow: hidden; }
  .jobhead { cursor: pointer; user-select: none; }
  .jobhead:hover small { color: var(--text); }
  .bar > div { height: 100%; background: var(--accent); transition: width .4s; }
  small { color: var(--dim); }
  video.result, video.sample { width: 100%; max-width: 640px; border-radius: 9px; margin-top: 10px; display: block; }
  a { color: var(--accent); text-decoration: none; margin-right: 12px; font-size: 13px; }
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--err); color: #fff; padding: 10px 20px; border-radius: 9px;
    display: none; z-index: 99; font-size: 13px;
  }
</style>
</head>
<body>
<header>
  <h1>🎬 Storyteller · 讲故事视频工作台</h1>
  <span class="status" id="engineInfo"></span>
  <button class="btn primary" id="runAll">▶ 一键生成</button>
</header>
<main>

  <section class="step">
    <h2><span class="no">1</span>故事文本
      <span class="hint">空行分段；是否按段切换画面在第 3 步选</span></h2>
    <textarea id="story" placeholder="在这里粘贴故事……"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn small" id="btnLoad">① 载入并切分</button>
      <small id="segInfo"></small>
    </div>

    <label class="f" style="margin-top:16px">从媒体文件提取（拖入音视频，自动转写并逐个入队生成）</label>
    <div class="dropzone" id="dropZone">
      拖拽音/视频文件到这里，或<input type="file" id="mediaFile" multiple accept="audio/*,video/*" style="display:none"><button class="btn small" onclick="document.getElementById('mediaFile').click()">选择文件</button>
    </div>
    <div class="jobs" id="sttJobs"></div>
  </section>

  <section class="step">
    <h2><span class="no">2</span>配音
      <span class="hint">先调引擎/音色/语速，再逐段试听</span></h2>
    <div class="row">
      <div>
        <label class="f">引擎</label>
        <select id="engine"></select>
      </div>
      <div id="edgeFields">
        <label class="f">音色</label>
        <select id="voice"></select>
      </div>
      <div>
        <label class="f">语速 <span id="rateVal">+0%</span></label>
        <input type="range" id="rate" min="-50" max="100" step="5" value="0">
      </div>
    </div>
    <div class="row" id="sovitsFields" style="display:none">
      <div><label class="f">参考音频路径</label><input type="text" id="refAudio" placeholder="/path/to/ref.wav"></div>
      <div><label class="f">参考音频文本</label><input type="text" id="promptText" placeholder="参考音频说的话"></div>
    </div>

    <details class="segbox" id="segBox">
      <summary>分段预览与试听 <span class="cnt" id="segCnt">0</span>
        <span style="margin-left:auto; display:flex; gap:8px" onclick="event.preventDefault()">
          <button class="btn small" id="btnSplit">切分</button>
          <button class="btn small" id="btnHearAll">② 全部试听</button>
        </span>
      </summary>
      <div class="inner" id="segments"><small>先在第 1 步载入文本。</small></div>
    </details>
  </section>

  <section class="step">
    <h2><span class="no">3</span>画面
      <span class="hint">循环氛围视频，自动压暗</span></h2>
    <div class="themes" id="themes"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn small" id="btnSample">③ 生成画面样片（3s）</button>
      <label class="checkbox"><input type="checkbox" id="perSeg"> 每段切换画面（默认整片一块连续背景）</label>
    </div>
    <video class="sample" id="sample" controls style="display:none"></video>
    <div class="upload">
      添加自己的素材：
      <input type="text" id="upTheme" placeholder="主题名，如 rain" style="width:140px">
      <input type="file" id="upFile" accept="video/mp4,image/*">
      <button class="btn small" id="btnUpload">上传</button>
    </div>
  </section>

  <section class="step">
    <h2><span class="no">4</span>合成
      <span class="hint">用当前各步配置出片</span></h2>
    <div class="row">
      <div><label class="f">BGM 音频路径（可选）</label><input type="text" id="bgm" placeholder="music.mp3"></div>
      <div style="flex:0; display:flex; align-items:flex-end; padding-bottom:6px">
        <label><input type="checkbox" id="srt" checked> 生成字幕</label>
      </div>
      <div style="flex:0; display:flex; align-items:flex-end; padding-bottom:2px">
        <button class="btn primary" id="btnCompose">④ 生成完整视频</button>
      </div>
    </div>
  </section>

  <section class="step">
    <h2><span class="no">✓</span>任务
      <span class="hint">按提交顺序执行，可取消</span></h2>
    <div class="tabs">
      <button class="tab sel" id="tabActive" onclick="setJobsTab('active')">未完成 <span id="cntActive">0</span></button>
      <button class="tab" id="tabDone" onclick="setJobsTab('done')">已完成 <span id="cntDone">0</span></button>
    </div>
    <div class="jobs" id="jobs"><small>还没有任务。</small></div>
  </section>

</main>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const state = { segments: [], durations: {}, defaultTheme: null };

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}
async function api(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) { let d = await r.json().catch(() => ({})); throw new Error(d.detail || r.statusText); }
  return r.json();
}

/* ---- 步骤 1：载入切分 ---- */
async function loadText() {
  const text = $('story').value;
  if (!text.trim()) return toast('请先粘贴故事文本');
  const d = await api('api/preview/split', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text})
  });
  state.segments = d.segments;
  state.durations = {};
  $('segCnt').textContent = d.segments.length + ' 段';
  $('segInfo').textContent = `已载入 ${d.segments.length} 段`;
  renderSegments();
  $('segBox').open = true;
}
$('btnLoad').onclick = () => loadText().catch(e => toast(e.message));
$('btnSplit').onclick = () => loadText().catch(e => toast(e.message));

function renderSegments() {
  $('segments').innerHTML = state.segments.length ? state.segments.map((s, i) => `
    <div class="seg">
      <span class="idx">${String(i+1).padStart(2,'0')}</span>
      <span class="txt">${s}</span>
      <span class="dur" id="dur-${i}">${state.durations[i] ? state.durations[i].toFixed(1) + 's' : ''}</span>
      <audio id="au-${i}" controls style="display:none"></audio>
      <button class="btn small" id="btn-${i}" onclick="previewSeg(${i})">▶ 试听</button>
    </div>`).join('') : '<small>先在第 1 步载入文本。</small>';
}
async function previewSeg(i) {
  const btn = $('btn-' + i);
  btn.disabled = true; btn.textContent = '…';
  try {
    const d = await api('api/preview/tts', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ text: state.segments[i], ...ttsPayload() })
    });
    state.durations[i] = d.duration;
    const au = $('au-' + i);
    au.src = d.url.replace(/^\//, ''); au.style.display = 'block'; au.play();
    $('dur-' + i).textContent = d.duration.toFixed(1) + 's';
    btn.textContent = '▶ 重听';
  } catch (e) { toast('试听失败：' + e.message); btn.textContent = '▶ 试听'; }
  btn.disabled = false;
}
window.previewSeg = previewSeg;

async function hearAll() {
  if (!state.segments.length) { await loadText(); }
  for (let i = 0; i < state.segments.length; i++) {
    await previewSeg(i);
    if (i < state.segments.length - 1) await new Promise(r => setTimeout(r, 400));
  }
}
$('btnHearAll').onclick = () => hearAll().catch(e => toast(e.message));

/* ---- 步骤 2：配音配置 ---- */
const VOICE_LABELS = {
  'zh-CN-YunyeNeural': '纪录片/历史解说 ★',
  'zh-CN-YunyangNeural': '新闻播报',
  'zh-CN-YunjianNeural': '浑厚解说',
  'zh-CN-YunxiNeural': '自然对话',
  'zh-CN-YunzeNeural': '成熟温暖',
  'zh-CN-YunhaoNeural': '磁性',
  'zh-CN-XiaoxiaoNeural': '温暖通用',
  'zh-CN-XiaoyiNeural': '活泼明快',
  'zh-CN-XiaomoNeural': '冷静解说',
  'zh-CN-XiaoruiNeural': '平静',
  'zh-CN-liaoning-XiaobeiNeural': '东北口音',
  'zh-CN-shaanxi-XiaoniNeural': '陕西口音',
};
async function initVoices() {
  let voices = [];
  try { voices = (await api('api/voices')).voices; } catch {}
  if (!voices.length) voices = [{short_name:'zh-CN-YunxiNeural', gender:'男', desc:'默认'}];
  voices.sort((a, b) =>
    (VOICE_LABELS[a.short_name] ? 0 : 1) - (VOICE_LABELS[b.short_name] ? 0 : 1)
    || a.short_name.localeCompare(b.short_name));
  $('voice').innerHTML = voices.map(v => {
    const label = VOICE_LABELS[v.short_name] || v.desc || '';
    return `<option value="${v.short_name}"${v.short_name === 'zh-CN-YunxiNeural' ? ' selected' : ''}>${v.gender} · ${v.short_name}${label ? '（' + label + '）' : ''}</option>`;
  }).join('');
}
async function initEngines() {
  const d = await api('api/engines');
  $('engine').innerHTML = d.tts.map(x => `<option value="${x}">${x}</option>`).join('');
  $('engineInfo').textContent = `TTS: ${d.tts.join('/')} · 画面: ${d.visual.join('/')}`;
  $('engine').onchange = onEngineChange;
  onEngineChange();
}
function onEngineChange() {
  const isEdge = $('engine').value === 'edge';
  $('edgeFields').style.display = isEdge ? '' : 'none';
  $('sovitsFields').style.display = isEdge ? 'none' : '';
}
function ttsPayload() {
  const p = { engine: $('engine').value };
  if (p.engine === 'edge') {
    p.voice = $('voice').value.trim() || 'zh-CN-YunxiNeural';
    p.rate = (v => (v >= 0 ? '+' : '') + v + '%')(+$('rate').value);
  } else {
    if ($('refAudio').value.trim()) p.ref_audio_path = $('refAudio').value.trim();
    if ($('promptText').value.trim()) p.prompt_text = $('promptText').value.trim();
  }
  return p;
}
$('rate').oninput = () => {
  const v = +$('rate').value;
  $('rateVal').textContent = (v >= 0 ? '+' : '') + v + '%';
};

/* ---- 步骤 3：画面 ---- */
async function initThemes() {
  const assets = await api('api/assets');
  const def = (await api('api/themes')).default;
  state.defaultTheme = def;
  const names = Object.keys(assets);
  $('themes').innerHTML = names.length ? names.map(t => {
    const f = assets[t][0];
    const chips = assets[t].map(x =>
      `<span class="chip">${x}<a class="del" onclick="event.stopPropagation(); delAsset('${t}','${x}')">✕</a></span>`
    ).join('');
    return `<div class="theme${t === def ? ' sel' : ''}" data-t="${t}" onclick="pickTheme('${t}')">
      <video muted loop preload="metadata" src="assets/loops/${t}/${f}"></video>
      <div class="name"><b>${t}</b><small>${assets[t].length} 个素材</small></div>
      <div class="chips">${chips}</div>
    </div>`;
  }).join('') : '<small>assets/loops 下还没有素材，先跑 bash scripts/fetch_loops.sh 或上传。</small>';
  document.querySelectorAll('.theme video').forEach(v => v.play().catch(() => {}));
}
function pickTheme(t) {
  document.querySelectorAll('.theme').forEach(el => el.classList.toggle('sel', el.dataset.t === t));
}
window.pickTheme = pickTheme;
async function delAsset(theme, file) {
  if (!confirm(`删除素材 ${theme}/${file}？该操作不可恢复。`)) return;
  try {
    await api(`api/assets/${theme}/${file}`, { method: 'DELETE' });
    await initThemes();
  } catch (e) { toast('删除失败：' + e.message); }
}
window.delAsset = delAsset;
function currentTheme() {
  const sel = document.querySelector('.theme.sel');
  return sel ? sel.dataset.t : state.defaultTheme;
}
$('btnSample').onclick = async () => {
  const btn = $('btnSample');
  btn.disabled = true; btn.textContent = '生成中…';
  try {
    const d = await api('api/preview/visual', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ theme: currentTheme(), duration: 3.0 })
    });
    const v = $('sample');
    v.src = d.url.replace(/^\//, ''); v.style.display = 'block'; v.play();
  } catch (e) { toast('样片失败：' + e.message); }
  btn.disabled = false; btn.textContent = '③ 生成画面样片（3s）';
};
$('btnUpload').onclick = async () => {
  const theme = $('upTheme').value.trim();
  const file = $('upFile').files[0];
  if (!theme || !file) return toast('填写主题名并选择文件');
  const fd = new FormData(); fd.append('theme', theme); fd.append('file', file);
  try {
    await api('api/assets/upload', { method: 'POST', body: fd });
    $('upTheme').value = ''; $('upFile').value = '';
    await initThemes(); pickTheme(theme);
  } catch (e) { toast('上传失败：' + e.message); }
};

/* ---- 步骤 4 / 一键生成 ---- */
function overrides() {
  const p = ttsPayload();
  const payload = {
    theme: currentTheme(),
    per_segment_visual: $('perSeg').checked,
    tts_name: p.engine,
    tts_opts: {},
  };
  for (const k of ['voice', 'rate', 'ref_audio_path', 'prompt_text']) {
    if (p[k] !== undefined) payload.tts_opts[k] = p[k];
  }
  payload.embed_srt = $('srt').checked;
  const bgm = $('bgm').value.trim();
  if (bgm) payload.bgm = bgm;
  return payload;
}
async function submitJob() {
  const text = $('story').value;
  if (!text.trim()) { toast('请先粘贴故事文本'); return false; }
  try {
    await api('api/jobs', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ text, overrides: overrides() })
    });
    refreshJobs(); startPolling();
    return true;
  } catch (e) { toast('提交失败：' + e.message); return false; }
}
$('btnCompose').onclick = submitJob;
$('runAll').onclick = submitJob;

/* ---- 任务列表（手风琴：只展开选中的一项） ---- */
let pollTimer = null;
let expandedJobId = null;
let jobsTab = 'active';
function setJobsTab(t) {
  jobsTab = t;
  document.getElementById('tabActive').classList.toggle('sel', t === 'active');
  document.getElementById('tabDone').classList.toggle('sel', t === 'done');
  refreshJobs();
}
window.setJobsTab = setJobsTab;
async function refreshJobs() {
  let jobs = [];
  try { jobs = await api('api/jobs'); } catch { return jobs; }
  const active = jobs.filter(j => j.status !== 'done');
  const done = jobs.filter(j => j.status === 'done');
  $('cntActive').textContent = active.length;
  $('cntDone').textContent = done.length;
  const list = jobsTab === 'active' ? active : done;
  const box = $('jobs');
  box.innerHTML = list.length ? '' : `<small>${jobsTab === 'active' ? '没有进行中的任务。' : '还没有已完成的任务。'}</small>`;
  for (const j of list) box.appendChild(jobCard(j));
  return jobs;
}
function jobCard(j) {
  const el = document.createElement('div');
  el.className = 'job';
  const pct = j.total ? Math.round(100 * j.progress / j.total) : 0;
  const expanded = expandedJobId === j.id;
  // 头部：始终可见，点击切换展开
  let body = `<div class="jobhead" onclick="toggleJob('${j.id}')">
    <b>${j.id}</b><span class="badge ${j.status}">${j.status}</span>
    <span class="del" title="删除任务" onclick="event.stopPropagation(); delJob('${j.id}')">✕</span>
    <small style="float:right">${j.created_at || ''} ${expanded ? '▾' : '▸'}</small>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <small>${j.stage || ''} ${j.status === 'failed' && j.error ? ' · ' + j.error : ''}</small>
  </div>`;
  // 展开区：仅选中项渲染
  if (expanded) {
    if (j.status === 'running' || j.status === 'queued') {
      body += `<div style="margin-top:8px"><button class="btn small" onclick="cancelJob('${j.id}')">取消</button></div>`;
    }
    if (j.status === 'done' && j.output) {
      const rel = j.output.split('outputs/').pop();
      body += `<video class="result" controls preload="metadata" src="outputs/${rel}"></video>
        <a href="outputs/${rel}" download>下载视频</a>` +
        (j.srt ? `<a href="outputs/${rel.replace(/\.mp4$/, '.srt')}">字幕</a>` : '');
    }
    if (j.status !== 'done' && j.error) {
      body += `<div class="txt" style="margin-top:8px">${j.error}</div>`;
    }
  }
  el.innerHTML = body;
  return el;
}
async function delJob(id) {
  if (!confirm(`删除任务 ${id}？其产物视频与目录将一并删除，不可恢复。`)) return;
  try {
    await api(`api/jobs/${id}`, { method: 'DELETE' });
    if (expandedJobId === id) expandedJobId = null;
    refreshJobs();
  } catch (e) { toast('删除失败：' + e.message); }
}
window.delJob = delJob;
function toggleJob(id) {
  expandedJobId = expandedJobId === id ? null : id;
  refreshJobs();
}
window.toggleJob = toggleJob;
async function cancelJob(id) {
  try {
    await api(`api/jobs/${id}/cancel`, { method: 'POST' });
    refreshJobs();
  } catch (e) { toast('取消失败：' + e.message); }
}
window.cancelJob = cancelJob;

/* ---- 媒体提取（STT） ---- */
const dz = $('dropZone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag');
  handleMediaFiles([...e.dataTransfer.files]);
});
$('mediaFile').addEventListener('change', e => handleMediaFiles([...e.target.files]));

async function handleMediaFiles(files) {
  const media = files.filter(f => /\.(mp3|wav|m4a|aac|flac|ogg|mp4|mov|mkv|webm|avi)$/i.test(f.name));
  if (!media.length) return toast('请拖入音视频文件');
  for (const f of media) {
    const fd = new FormData();
    fd.append('files', f);
    fd.append('auto_generate', 'true');
    try { await api('api/stt/upload', { method: 'POST', body: fd }); }
    catch (e) { toast(`${f.name} 上传失败：` + e.message); }
  }
  refreshSttJobs(); startPolling();
}

function toggleSttText(id) {
  const el = document.getElementById('stt-txt-' + id);
  if (el) el.classList.toggle('open');
}
window.toggleSttText = toggleSttText;

/* ---- 文本框拖入 .txt/.md 文件 ---- */
const storyEl = $('story');
storyEl.addEventListener('dragover', e => { e.preventDefault(); storyEl.classList.add('drag'); });
storyEl.addEventListener('dragleave', () => storyEl.classList.remove('drag'));
storyEl.addEventListener('drop', async e => {
  e.preventDefault(); e.stopPropagation(); storyEl.classList.remove('drag');
  const f = [...e.dataTransfer.files].find(f => /\.(txt|md)$/i.test(f.name));
  if (!f) return;
  storyEl.value = await f.text();
  loadText().catch(err => toast(err.message));
});

async function refreshSttJobs() {
  let jobs = [];
  try { jobs = await api('api/stt/jobs'); } catch { return jobs; }
  const box = $('sttJobs');
  box.innerHTML = jobs.length ? '' : '';
  for (const j of jobs) {
    const el = document.createElement('div');
    el.className = 'sttjob';
    let body = `<b>${j.filename}</b><span class="badge ${j.status}">${j.status}</span>
      <span class="del" title="删除" onclick="delStt('${j.id}')">✕</span>
      <small style="float:right">${j.created_at || ''}</small>`;
    if (j.text) body += `<div class="txt" id="stt-txt-${j.id}" onclick="toggleSttText('${j.id}')">${j.text}</div>`;
    if (j.gen_job_id) body += `<small>已入队生成任务 <b>${j.gen_job_id}</b>（见下方任务列表）</small>`;
    if (j.error) body += `<small> · ${j.error}</small>`;
    if (j.status === 'queued' || j.status === 'transcribing') {
      body += `<div style="margin-top:6px"><button class="btn small" onclick="cancelStt('${j.id}')">取消</button></div>`;
    }
    el.innerHTML = body;
    box.appendChild(el);
  }
  return jobs;
}
async function cancelStt(id) {
  try {
    await api(`api/stt/jobs/${id}/cancel`, { method: 'POST' });
    refreshSttJobs();
  } catch (e) { toast('取消失败：' + e.message); }
}
window.cancelStt = cancelStt;
async function delStt(id) {
  if (!confirm('删除该提取任务？已上传的媒体文件将一并删除，不可恢复。')) return;
  try {
    await api(`api/stt/jobs/${id}`, { method: 'DELETE' });
    refreshSttJobs();
  } catch (e) { toast('删除失败：' + e.message); }
}
window.delStt = delStt;

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    const [jobs, stt] = await Promise.all([refreshJobs(), refreshSttJobs()]);
    const busy = (j) => j.status === 'running' || j.status === 'queued'
      || j.status === 'transcribing';
    if (!jobs.some(busy) && !stt.some(busy)) {
      clearInterval(pollTimer); pollTimer = null;
    }
  }, 2000);
}

initEngines();
initVoices();
initThemes();
refreshJobs().then(jobs => {
  refreshSttJobs().then(stt => {
    if (jobs.some(j => j.status === 'running' || j.status === 'queued')
      || stt.some(j => j.status === 'queued' || j.status === 'transcribing')) startPolling();
  });
});
</script>
</body>
</html>
